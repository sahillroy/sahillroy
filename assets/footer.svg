<svg viewBox="0 0 1000 90" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Status: building">
  <style>
    :root { --bone: #444444; --muted: #888888; --rule: #C0C0C0; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --muted: #777777; --rule: #444444; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: d 1.6s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .dot { animation: p 2.4s ease-in-out infinite; }
    @keyframes p { 0%,100%{opacity:1} 50%{opacity:.35} }
    @media (prefers-reduced-motion: reduce) { .draw,.dot{animation:none} .draw{stroke-dashoffset:0} }
  </style>
  <line class="draw" x1="48" y1="24" x2="952" y2="24"/>
  <circle class="dot" cx="60" cy="54" r="4" fill="var(--accent)"/>
  <text class="mono" x="82" y="52" font-size="12" letter-spacing="3" fill="var(--bone)">STATUS — BUILDING</text>
  <text class="mono" x="82" y="72" font-size="11" letter-spacing="2" fill="var(--muted)">always coding, always learning</text>
  <text class="mono" x="952" y="56" font-size="15" text-anchor="end" fill="var(--muted)">[CITY, IN]&#160;&#160;&#183;&#160;&#160;&#169; 2026</text>
</svg>
