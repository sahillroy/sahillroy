<svg viewBox="0 0 1000 590" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Five projects by Sahil Roy">
  <style>
    :root { --ink:#000000; --paper:#FFFFFF; }
    @media (prefers-color-scheme:dark) { :root { --ink:#FFFFFF; --paper:#000000; } }
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .row { opacity:0; animation:reveal .55s cubic-bezier(.2,.7,.2,1) forwards; }
    .rule { stroke:var(--ink); stroke-width:1; }
    .title { fill:var(--ink); font-size:17px; font-weight:700; letter-spacing:.8px; }
    .copy { fill:var(--ink); font-size:12px; }
    .meta { fill:var(--ink); font-size:11px; letter-spacing:.4px; }
    @keyframes reveal { from { opacity:0; } to { opacity:1; } }
    .r1{animation-delay:.05s}.r2{animation-delay:.10s}.r3{animation-delay:.15s}.r4{animation-delay:.20s}.r5{animation-delay:.25s}
    @media (prefers-reduced-motion:reduce) { .row { animation:none; opacity:1; } }
  </style>

  <g class="mono">
    <g class="row r1" transform="translate(0 20)">
      <text class="title" x="48" y="24">01 / MODIJI</text>
      <text class="copy" x="48" y="49">An ML model recommending PM internship scheme opportunities to candidates.</text>
      <text class="copy" x="48" y="68">Ranks recommendations based on candidate skill profile and area of interest.</text>
      <text class="meta" x="48" y="87">PYTHON · MACHINE LEARNING · RECOMMENDATION SYSTEM</text>
      <line class="rule" x1="48" y1="104" x2="952" y2="104"/>
    </g>
    <g class="row r2" transform="translate(0 130)">
      <text class="title" x="48" y="24">02 / BITCOIN-TRADER-SENTIMENT-ANALYSIS</text>
      <text class="copy" x="48" y="49">[Add a one-line description]</text>
      <text class="meta" x="48" y="87">JUPYTER NOTEBOOK · SENTIMENT ANALYSIS</text>
      <line class="rule" x1="48" y1="104" x2="952" y2="104"/>
    </g>
    <g class="row r3" transform="translate(0 240)">
      <text class="title" x="48" y="24">03 / PROOFSTACK</text>
      <text class="copy" x="48" y="49">[Add a one-line description]</text>
      <text class="meta" x="48" y="87">TYPESCRIPT</text>
      <line class="rule" x1="48" y1="104" x2="952" y2="104"/>
    </g>
    <g class="row r4" transform="translate(0 350)">
      <text class="title" x="48" y="24">04 / AI-SOC-ANALYST-ASSISTANT</text>
      <text class="copy" x="48" y="49">An AI-assisted tool supporting SOC (Security Operations Center) analyst workflows.</text>
      <text class="meta" x="48" y="87">JAVASCRIPT · SECURITY</text>
      <line class="rule" x1="48" y1="104" x2="952" y2="104"/>
    </g>
    <g class="row r5" transform="translate(0 460)">
      <text class="title" x="48" y="24">05 / CP</text>
      <text class="copy" x="48" y="49">Competitive programming solutions and practice.</text>
      <text class="meta" x="48" y="87">C++</text>
      <line class="rule" x1="48" y1="104" x2="952" y2="104"/>
    </g>
  </g>
</svg>
