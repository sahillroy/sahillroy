<svg width="1150" height="810" viewBox="0 0 1150 810" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, monospace">
  <style>
    .reveal { stroke-dasharray: 730; stroke-dashoffset: 730; animation: revealline 1.3s cubic-bezier(.4,0,.2,1) .3s forwards; }
    @keyframes revealline { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .reveal { animation: none; stroke-dashoffset: 0; } }
  </style>

  <rect width="1150" height="810" fill="#0d1117"/>
  <text x="0" y="56" font-size="62" fill="#ffffff" font-weight="bold">02</text>
  <text x="90" y="48" font-size="20" letter-spacing="3" fill="#e6e6ec">PROJECTS</text>
  <line class="reveal" x1="260" y1="40" x2="990" y2="40" stroke="#c9c9d1" stroke-width="1"/>
  <text x="1150" y="48" font-size="13" fill="#6f6f78" text-anchor="end">~/02-projects</text>

  <text x="0" y="122" font-size="21" fill="#ffffff" font-weight="bold">01 / SENTINEL CORE</text>
  <text x="0" y="153" font-size="17" fill="#b7b7bf">AI-powered SOC analyst dashboard — anomaly detection, rule-based</text>
  <text x="0" y="178" font-size="17" fill="#b7b7bf">detection, and LLM-based alert enrichment.</text>
  <text x="0" y="206" font-size="14" fill="#7c7c85">FASTAPI · REACT · POSTGRESQL · LLM ENRICHMENT</text>
  <line x1="0" y1="234" x2="1150" y2="234" stroke="#20202a" stroke-width="1"/>

  <text x="0" y="278" font-size="21" fill="#ffffff" font-weight="bold">02 / PMIS</text>
  <text x="0" y="309" font-size="17" fill="#b7b7bf">Smart project &amp; scheme allocation engine, built for a Ministry of</text>
  <text x="0" y="334" font-size="17" fill="#b7b7bf">Corporate Affairs problem statement — Aadhaar KYC, voice intake.</text>
  <text x="0" y="362" font-size="14" fill="#7c7c85">FASTAPI · NEXT.JS · POSTGRESQL · GROQ</text>
  <line x1="0" y1="390" x2="1150" y2="390" stroke="#20202a" stroke-width="1"/>

  <text x="0" y="434" font-size="21" fill="#ffffff" font-weight="bold">03 / CAMPUSHIRE ADVISOR</text>
  <text x="0" y="465" font-size="17" fill="#b7b7bf">AI hiring assistant that matches candidates to roles and streamlines</text>
  <text x="0" y="490" font-size="17" fill="#b7b7bf">campus recruitment workflows.</text>
  <text x="0" y="518" font-size="14" fill="#7c7c85">REACT · FASTAPI</text>
  <line x1="0" y1="546" x2="1150" y2="546" stroke="#20202a" stroke-width="1"/>

  <text x="0" y="590" font-size="21" fill="#ffffff" font-weight="bold">04 / BITCOIN TRADER SENTIMENT ANALYSIS</text>
  <text x="0" y="621" font-size="17" fill="#b7b7bf">Statistical pipeline correlating Fear &amp; Greed Index with trader</text>
  <text x="0" y="646" font-size="17" fill="#b7b7bf">performance — hypothesis testing, logistic regression.</text>
  <text x="0" y="674" font-size="14" fill="#7c7c85">PYTHON · PANDAS · STATISTICS</text>
  <line x1="0" y1="702" x2="1150" y2="702" stroke="#20202a" stroke-width="1"/>

  <text x="0" y="746" font-size="21" fill="#ffffff" font-weight="bold">05 / DOC-QA-RAG</text>
  <text x="0" y="777" font-size="17" fill="#b7b7bf">Retrieval-augmented Q&amp;A system, built manually in raw Python before</text>
  <text x="0" y="802" font-size="17" fill="#b7b7bf">layering in LangChain. <tspan fill="#3ddc84">(in progress)</tspan></text>
</svg>
