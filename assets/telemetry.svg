<svg viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telemetry — repository overview and live data">
  <style>
    :root { --bone: #444444; --muted: #888888; --rule: #C0C0C0; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --muted: #777777; --rule: #444444; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .panel { fill:none; stroke:var(--rule); stroke-width:1; }
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(6px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.25s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>
  <rect class="panel rise a1" x="24" y="10" width="410" height="270"/>
  <text class="mono rise a1" x="48" y="46" font-size="13" letter-spacing="2" fill="var(--bone)">REPOSITORY OVERVIEW</text>
  <line x1="48" y1="60" x2="410" y2="60" stroke="var(--rule)" opacity=".5"/>
  <text class="mono rise a1" x="48" y="100" font-size="14" fill="var(--muted)">Public repositories</text>
  <text class="mono rise a1" x="410" y="100" font-size="14" fill="var(--bone)" text-anchor="end">6</text>
  <text class="mono rise a1" x="48" y="140" font-size="14" fill="var(--muted)">Total contributions</text>
  <text class="mono rise a1" x="410" y="140" font-size="14" fill="var(--bone)" text-anchor="end">308</text>
  <text class="mono rise a1" x="48" y="180" font-size="14" fill="var(--muted)">Longest streak</text>
  <text class="mono rise a1" x="410" y="180" font-size="14" fill="var(--bone)" text-anchor="end">9 days</text>

  <rect class="panel rise a2" x="460" y="10" width="490" height="270"/>
  <text class="mono rise a2" x="484" y="46" font-size="13" letter-spacing="2" fill="var(--bone)">LIVE DATA</text>
  <line x1="484" y1="60" x2="926" y2="60" stroke="var(--rule)" opacity=".5"/>
  <text class="mono rise a2" x="484" y="100" font-size="14" fill="var(--muted)">Language distribution, streaks, and commit</text>
  <text class="mono rise a2" x="484" y="126" font-size="14" fill="var(--muted)">activity render live below via GitHub stats</text>
  <text class="mono rise a2" x="484" y="152" font-size="14" fill="var(--muted)">widgets — always current, no manual updates.</text>
</svg>
