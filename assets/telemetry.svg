<svg width="1150" height="1000" viewBox="0 0 1150 1000" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, monospace" role="img" aria-label="Telemetry">
  <style>
    :root { --bone: #e6e6ec; --muted: #9a9aa3; --dim: #7c7c85; --rule: #3a3a45; --accent: #ffffff; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .g1{transform-origin:0px 0;animation-delay:.3s}.g2{transform-origin:0px 0;animation-delay:.45s}.g3{transform-origin:0px 0;animation-delay:.6s}
    .g4{transform-origin:0px 0;animation-delay:.75s}
    .spark { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.2s cubic-bezier(.6,0,.2,1) .5s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .dot { opacity: 0; animation: fade .4s ease forwards; }
    .d1{animation-delay:1.0s}.d2{animation-delay:1.3s}.d3{animation-delay:1.6s}.d4{animation-delay:1.9s}.d5{animation-delay:2.2s}
    @keyframes fade { to { opacity: 1; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .n1{animation-delay:.2s}.n2{animation-delay:.35s}.n3{animation-delay:.5s}
    .m1{animation-delay:.5s}.m2{animation-delay:.7s}.m3{animation-delay:.9s}
    .ping { animation: ping 2.2s ease-out infinite; transform-origin: 671px 484px; }
    @keyframes ping { 0%{transform:scale(.4);opacity:.9} 80%,100%{transform:scale(2.8);opacity:0} }
    .reveal { stroke-dasharray: 720; stroke-dashoffset: 720; animation: revealline 1.3s cubic-bezier(.4,0,.2,1) .3s forwards; }
    @keyframes revealline { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .bar,.spark,.dot,.rise,.ping,.reveal { animation: none; }
      .bar{transform:scaleX(1)} .spark{stroke-dashoffset:0} .dot,.rise{opacity:1} .ping{opacity:0} .reveal{stroke-dashoffset:0}
    }
  </style>

  <rect width="1150" height="1000" fill="#0d1117"/>

  <!-- header (once) -->
  <text x="0" y="46" font-size="44" fill="#ffffff" font-weight="bold">03</text>
  <text x="68" y="40" font-size="20" letter-spacing="3" fill="#e6e6ec">TELEMETRY</text>
  <line class="reveal" x1="270" y1="40" x2="990" y2="40" stroke="#c9c9d1" stroke-width="1"/>
  <text x="1150" y="40" font-size="13" fill="#6f6f78" text-anchor="end">~/03-telemetry</text>

  <!-- SECTION 1: repository overview + activity -->
  <rect x="0" y="90" width="360" height="270" fill="none" stroke="var(--rule)" stroke-width="1"/>
  <text x="20" y="124" font-size="15" letter-spacing="1" fill="var(--bone)">REPOSITORY OVERVIEW</text>
  <line x1="20" y1="140" x2="340" y2="140" stroke="#20202a" stroke-width="1"/>
  <text x="20" y="184" font-size="17" fill="var(--muted)">Public repositories</text>
  <text x="340" y="184" font-size="17" fill="#ffffff" text-anchor="end">18</text>
  <text x="20" y="226" font-size="17" fill="var(--muted)">Stars received</text>
  <text x="340" y="226" font-size="17" fill="#ffffff" text-anchor="end">0</text>
  <text x="20" y="268" font-size="17" fill="var(--muted)">Primary language</text>
  <text x="340" y="268" font-size="17" fill="#ffffff" text-anchor="end">Python*</text>
  <text x="20" y="310" font-size="17" fill="var(--muted)">Focus area</text>
  <text x="340" y="310" font-size="17" fill="#ffffff" text-anchor="end">ML / Security</text>

  <rect x="390" y="90" width="760" height="270" fill="none" stroke="var(--rule)" stroke-width="1"/>
  <text x="410" y="124" font-size="15" letter-spacing="1" fill="var(--bone)">ACTIVITY</text>
  <line x1="410" y1="140" x2="1130" y2="140" stroke="#20202a" stroke-width="1"/>
  <line x1="650" y1="170" x2="650" y2="330" stroke="#2a2a33" stroke-width="1"/>
  <line x1="890" y1="170" x2="890" y2="330" stroke="#2a2a33" stroke-width="1"/>

  <g class="rise n1">
    <text x="410" y="240" font-size="44" fill="#ffffff">408</text>
    <text x="410" y="268" font-size="12" fill="var(--muted)" letter-spacing="1.5">TOTAL CONTRIBUTIONS</text>
    <text x="410" y="286" font-size="10.5" fill="var(--dim)">Feb 7, 2024 – present</text>
  </g>
  <g class="rise n2">
    <text x="650" y="240" font-size="44" fill="#ffffff">4</text>
    <text x="650" y="268" font-size="12" fill="var(--muted)" letter-spacing="1.5">CURRENT STREAK</text>
    <text x="650" y="286" font-size="10.5" fill="var(--dim)">Jul 23 – Jul 26</text>
  </g>
  <g class="rise n3">
    <text x="890" y="240" font-size="44" fill="#ffffff">9</text>
    <text x="890" y="268" font-size="12" fill="var(--muted)" letter-spacing="1.5">LONGEST STREAK</text>
    <text x="890" y="286" font-size="10.5" fill="var(--dim)">Jun 10 – Jun 18, 2025</text>
  </g>

  <!-- SECTION 2 (now second): language distribution + shipping velocity + counters -->
  <text fill="var(--dim)" class="mono" x="0" y="390" font-size="11" letter-spacing="2.5">TELEMETRY — WHAT THE HANDS ARE DOING</text>
  <text fill="var(--dim)" class="mono" x="1150" y="390" font-size="11" letter-spacing="2.5" text-anchor="end">FIG. 02</text>
  <line x1="0" y1="402" x2="1150" y2="402" stroke="var(--rule)"/>
  <line x1="360" y1="426" x2="360" y2="632" stroke="var(--rule)" opacity=".4"/>
  <line x1="760" y1="426" x2="760" y2="632" stroke="var(--rule)" opacity=".4"/>

  <text fill="var(--dim)" class="mono" x="0" y="440" font-size="10" letter-spacing="2.5">LANGUAGE DISTRIBUTION · EST. — VERIFY</text>
  <g class="mono" font-size="13">
    <text fill="var(--bone)" x="0" y="474">python</text>       <rect class="bar g1" x="0" y="484" width="260" height="8" fill="var(--accent)"/><text fill="var(--muted)" x="272" y="492" font-size="11">~40%</text>
    <text fill="var(--bone)" x="0" y="516">c++</text>           <rect class="bar g2" x="0" y="526" width="170" height="8" fill="var(--bone)" opacity=".7"/><text fill="var(--muted)" x="182" y="534" font-size="11">~26%</text>
    <text fill="var(--bone)" x="0" y="558">javascript/ts</text> <rect class="bar g3" x="0" y="568" width="125" height="8" fill="var(--bone)" opacity=".5"/><text fill="var(--muted)" x="137" y="576" font-size="11">~19%</text>
    <text fill="var(--bone)" x="0" y="600">other</text>         <rect class="bar g4" x="0" y="610" width="95"  height="8" fill="var(--bone)" opacity=".3"/><text fill="var(--muted)" x="107" y="618" font-size="11">~15%</text>
  </g>

  <text fill="var(--dim)" class="mono" x="560" y="440" font-size="10" letter-spacing="2.5" text-anchor="middle">SHIPPING VELOCITY · 2024 → 2026 (ILLUSTRATIVE)</text>
  <g>
    <line x1="400" y1="600" x2="720" y2="600" stroke="var(--rule)"/>
    <polyline class="spark" points="400,590 456,582 511,564 567,546 623,516 671,484 720,468" stroke="var(--accent)" stroke-width="1.5" fill="none"/>
    <circle class="dot d1" cx="456" cy="582" r="2.5" fill="var(--bone)"/>
    <circle class="dot d2" cx="511" cy="564" r="2.5" fill="var(--bone)"/>
    <circle class="dot d3" cx="567" cy="546" r="2.5" fill="var(--bone)"/>
    <circle class="dot d4" cx="623" cy="516" r="2.5" fill="var(--bone)"/>
    <circle class="ping" cx="671" cy="484" r="4" stroke="var(--accent)" fill="none"/>
    <circle class="dot d5" cx="671" cy="484" r="3" fill="var(--accent)"/>
    <text fill="var(--dim)" class="mono" x="400" y="620" font-size="9.5" letter-spacing="1.5">'24</text>
    <text fill="var(--dim)" class="mono" x="560" y="620" font-size="9.5" letter-spacing="1.5" text-anchor="middle">'25</text>
    <text fill="var(--dim)" class="mono" x="720" y="620" font-size="9.5" letter-spacing="1.5" text-anchor="end">'26</text>
  </g>

  <g>
    <g class="rise m1"><text fill="var(--bone)" class="mono" x="780" y="470" font-size="34">18</text><text fill="var(--muted)" class="mono" x="846" y="462" font-size="11" letter-spacing="2">REPOSITORIES</text></g>
    <g class="rise m2"><text fill="var(--bone)" class="mono" x="780" y="534" font-size="34">5</text><text fill="var(--muted)" class="mono" x="846" y="526" font-size="11" letter-spacing="2">PROJECTS DOCUMENTED</text></g>
    <g class="rise m3"><text fill="var(--bone)" class="mono" x="780" y="598" font-size="34">0</text><text fill="var(--muted)" class="mono" x="846" y="590" font-size="11" letter-spacing="2">STARS RECEIVED</text></g>
  </g>

  <!-- SECTION 3 (now last): contribution chart placeholder -->
  <rect x="0" y="650" width="1150" height="290" fill="none" stroke="var(--rule)" stroke-width="1"/>
  <text x="20" y="684" font-size="15" letter-spacing="1" fill="var(--bone)">CONTRIBUTION TELEMETRY</text>
  <line x1="20" y1="700" x2="1130" y2="700" stroke="#20202a" stroke-width="1"/>
  <g class="mono">
    <line x1="60" y1="900.0" x2="1090" y2="900.0" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3" opacity=".35"/>
    <text fill="var(--dim)" x="45" y="904.0" font-size="10" text-anchor="end">0</text>
    <line x1="60" y1="820.0" x2="1090" y2="820.0" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3" opacity=".35"/>
    <text fill="var(--dim)" x="45" y="824.0" font-size="10" text-anchor="end">36</text>
    <line x1="60" y1="740.0" x2="1090" y2="740.0" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3" opacity=".35"/>
    <text fill="var(--dim)" x="45" y="744.0" font-size="10" text-anchor="end">72</text>
    <line x1="60" y1="900" x2="1090" y2="900" stroke="var(--rule)" stroke-width="1"/>
    <polyline points="60.0,900.0 95.5,900.0 131.0,900.0 166.6,900.0 202.1,900.0 237.6,897.8 273.1,900.0 308.6,900.0 344.1,897.8 379.7,900.0 415.2,900.0 450.7,900.0 486.2,897.8 521.7,895.6 557.2,897.8 592.8,900.0 628.3,900.0 663.8,900.0 699.3,900.0 734.8,893.3 770.3,900.0 805.9,900.0 841.4,740.0 876.9,900.0 912.4,900.0 947.9,900.0 983.4,868.9 1019.0,895.6 1054.5,873.3 1090.0,884.4" stroke="var(--accent)" stroke-width="1.5" fill="none"/>
    <circle cx="1090.0" cy="884.4" r="3" fill="var(--accent)"/>
    <text fill="var(--dim)" x="60.0" y="920" font-size="9" text-anchor="middle">27</text>
    <text fill="var(--dim)" x="166.6" y="920" font-size="9" text-anchor="middle">30</text>
    <text fill="var(--dim)" x="273.1" y="920" font-size="9" text-anchor="middle">3</text>
    <text fill="var(--dim)" x="379.7" y="920" font-size="9" text-anchor="middle">6</text>
    <text fill="var(--dim)" x="486.2" y="920" font-size="9" text-anchor="middle">9</text>
    <text fill="var(--dim)" x="592.8" y="920" font-size="9" text-anchor="middle">12</text>
    <text fill="var(--dim)" x="699.3" y="920" font-size="9" text-anchor="middle">15</text>
    <text fill="var(--dim)" x="805.9" y="920" font-size="9" text-anchor="middle">18</text>
    <text fill="var(--dim)" x="912.4" y="920" font-size="9" text-anchor="middle">21</text>
    <text fill="var(--dim)" x="1019.0" y="920" font-size="9" text-anchor="middle">24</text>
    <text fill="var(--dim)" x="1090.0" y="920" font-size="9" text-anchor="middle">26</text>
    <text fill="var(--dim)" x="60" y="944" font-size="11" letter-spacing="1.5">last 30 days</text>
  </g>
</svg>
