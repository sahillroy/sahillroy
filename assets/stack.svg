<svg viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack — languages, ai, web, data, cloud, tooling">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(6px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.3s} .a4{animation-delay:.4s} .a5{animation-delay:.5s} .a6{animation-delay:.6s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>
  <line x1="150" y1="8" x2="150" y2="290" stroke="var(--rule)" stroke-width="1" opacity=".4"/>
  <text class="mono rise a1" x="48" y="32"  font-size="12" fill="var(--muted)" letter-spacing="2">LANGUAGES</text>
  <text class="mono rise a1" x="166" y="32"  font-size="15" fill="var(--bone)">C · C++ · Python · JavaScript · HTML5 / CSS3</text>
  <text class="mono rise a2" x="48" y="64"  font-size="12" fill="var(--muted)" letter-spacing="2">AI / ML</text>
  <text class="mono rise a2" x="166" y="64"  font-size="15" fill="var(--bone)">TensorFlow · Keras · scikit-learn · Pandas · NumPy · Matplotlib · SciPy</text>
  <text class="mono rise a3" x="48" y="96"  font-size="12" fill="var(--muted)" letter-spacing="2">WEB</text>
  <text class="mono rise a3" x="166" y="96"  font-size="15" fill="var(--bone)">React · Node.js · Flask · TailwindCSS · Vite</text>
  <text class="mono rise a4" x="48" y="128" font-size="12" fill="var(--muted)" letter-spacing="2">DATA</text>
  <text class="mono rise a4" x="166" y="128" font-size="15" fill="var(--bone)">MySQL · MongoDB · PostgreSQL</text>
  <text class="mono rise a5" x="48" y="160" font-size="12" fill="var(--muted)" letter-spacing="2">CLOUD / DEVOPS</text>
  <text class="mono rise a5" x="166" y="160" font-size="15" fill="var(--bone)">AWS · Docker · Nginx · Anaconda</text>
  <text class="mono rise a6" x="48" y="192" font-size="12" fill="var(--muted)" letter-spacing="2">TOOLING</text>
  <text class="mono rise a6" x="166" y="192" font-size="15" fill="var(--bone)">Git · GitHub · Figma · Canva · Twilio · Markdown</text>
</svg>
